services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./videos:/app/videos
    network_mode: host
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    network_mode: host
    depends_on:
      - app
    restart: unless-stopped
